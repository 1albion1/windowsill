<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Tray mark: the cat alone, no window and no sill.

    A tray icon renders at 16px against a taskbar that may be light or dark, so
    it drops everything the app icon uses for warmth and keeps only the
    silhouette, in a mid-tone amber that holds contrast against both.
    The transform lifts the cat out of the app icon's composition and fits it
    to this canvas, so the two marks stay in sync if the drawing changes.
  -->
  <g transform="translate(-253.5, -154.5) scale(1.594)" fill="#e8883a">
    <path d="M320 392 C396 404 444 374 436 322 C430 284 402 268 386 286"
          fill="none" stroke="#e8883a" stroke-width="27" stroke-linecap="round" />
    <ellipse cx="250" cy="345" rx="82" ry="58" />
    <ellipse cx="248" cy="292" rx="54" ry="66" />
    <circle cx="246" cy="216" r="58" />
    <path d="M196 188 L190 124 L236 170 Z" />
    <path d="M296 188 L302 124 L256 170 Z" />
  </g>
</svg>
