<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Windowsill app icon, small-size variant: used for the 16px and 24px entries
    in icon.ico.

    At that size the window frame stops being a window and becomes noise, and
    the cat is too small for the tail to stay attached. So the frame goes, the
    cat grows to fill the tile, and only the sill stays to keep the idea intact.
    Same drawing, same palette, fewer things fighting for eight pixels.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffdf9b" />
      <stop offset="0.5" stop-color="#f7ad4a" />
      <stop offset="1" stop-color="#e07f2a" />
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="104" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)" />

    <!-- The same cat, lifted out of the full composition and scaled to fill. -->
    <g transform="translate(-109.7, -46.8) scale(1.183)">
      <g fill="#2b1d12">
        <path d="M320 392 C396 404 444 374 436 322 C430 284 402 268 386 286"
              fill="none" stroke="#2b1d12" stroke-width="27" stroke-linecap="round" />
        <ellipse cx="250" cy="345" rx="82" ry="58" />
        <ellipse cx="248" cy="292" rx="54" ry="66" />
        <circle cx="246" cy="216" r="58" />
        <path d="M196 188 L190 124 L236 170 Z" />
        <path d="M296 188 L302 124 L256 170 Z" />
      </g>
      <g fill="#ffd98a">
        <ellipse cx="227" cy="209" rx="8.5" ry="11" />
        <ellipse cx="267" cy="209" rx="8.5" ry="11" />
      </g>
    </g>

    <rect x="0" y="428" width="512" height="84" fill="#6d3a16" />
    <rect x="0" y="428" width="512" height="12" fill="#9a5a26" />
  </g>
</svg>
